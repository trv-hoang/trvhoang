<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Two agents passing a guide between them, with the writer's notes blocked">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1917"/>
      <stop offset="1" stop-color="#292524"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d6d3d1"/></marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  </style>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- writer -->
  <rect x="80" y="145" width="200" height="160" rx="18" fill="#451a03" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="180" cy="200" r="22" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="172" cy="196" r="3" fill="#f59e0b"/>
  <circle cx="188" cy="196" r="3" fill="#f59e0b"/>
  <path d="M171 207 Q180 214 189 207" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <text x="180" y="270" fill="#fef3c7" font-size="22" font-weight="600" text-anchor="middle">Writer</text>

  <!-- reviewer -->
  <rect x="520" y="145" width="200" height="160" rx="18" fill="#451a03" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="612" cy="196" r="17" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <line x1="624" y1="208" x2="636" y2="220" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="270" fill="#fef3c7" font-size="22" font-weight="600" text-anchor="middle">Reviewer</text>

  <!-- the guide passes -->
  <path d="M290 260 H510" stroke="#d6d3d1" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <rect x="368" y="222" width="64" height="80" rx="6" fill="#fafaf9"/>
  <line x1="380" y1="242" x2="420" y2="242" stroke="#a8a29e" stroke-width="3"/>
  <line x1="380" y1="256" x2="420" y2="256" stroke="#a8a29e" stroke-width="3"/>
  <line x1="380" y1="270" x2="410" y2="270" stroke="#a8a29e" stroke-width="3"/>
  <rect x="380" y="281" width="34" height="10" rx="2" fill="#fecaca"/>
  <text x="400" y="330" fill="#a8a29e" font-size="15" text-anchor="middle">guide.md</text>

  <!-- the notes do not -->
  <path d="M290 175 H510" stroke="#f87171" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>
  <rect x="380" y="150" width="40" height="48" rx="5" fill="#292524" stroke="#a8a29e" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="437" y1="160" x2="463" y2="190" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <line x1="463" y1="160" x2="437" y2="190" stroke="#f87171" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="130" fill="#f87171" font-size="15" text-anchor="middle">notes stay with the writer</text>
</svg>
