<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" role="img" aria-labelledby="t d">
  <title id="t">How the guide writer and reviewer share work</title>
  <desc id="d">Source code feeds the writer agent, which produces the guide and images plus private notes in facts.md. The reviewer agent gets the guide, images and original source, but the writer's notes are withheld. Review findings either send corrections back to the writer or go to a person, who approves with their own words, the date and a content hash. Only then is a Word file exported, and never while MISSING markers remain.</desc>
  <style>
    .bg { fill: #fafaf9; }
    .box { fill: #ffffff; stroke: #57534e; stroke-width: 1.5; }
    .agent { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
    .private { fill: #f5f5f4; stroke: #78716c; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .human { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
    .line { fill: none; stroke: #57534e; stroke-width: 1.6; }
    .loop { fill: none; stroke: #b45309; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .blocked { fill: none; stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 4 4; }
    .x { stroke: #b91c1c; stroke-width: 2.5; }
    .head { fill: #57534e; }
    .head-loop { fill: #b45309; }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1c1917; }
    .title { font-size: 15px; font-weight: 600; }
    .sub { font-size: 12px; fill: #57534e; }
    .label { font-size: 12px; fill: #57534e; }
    .label-loop { font-size: 12px; fill: #b45309; }
    .label-red { font-size: 12px; fill: #b91c1c; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1917; }
      .box { fill: #292524; stroke: #a8a29e; }
      .agent { fill: #451a03; stroke: #f59e0b; }
      .private { fill: #1c1917; stroke: #a8a29e; }
      .human { fill: #082f49; stroke: #38bdf8; }
      .line { stroke: #a8a29e; }
      .loop { stroke: #f59e0b; }
      .blocked, .x { stroke: #f87171; }
      .head { fill: #a8a29e; }
      .head-loop { fill: #f59e0b; }
      text { fill: #f4f4f2; }
      .sub, .label { fill: #a8a29e; }
      .label-loop { fill: #f59e0b; }
      .label-red { fill: #f87171; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-loop" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="840" height="460" rx="16"/>

  <!-- corrections loop, drawn first so boxes sit on top -->
  <path class="loop" d="M735 220 V22 H315 V38" marker-end="url(#al)"/>
  <text class="label-loop" x="525" y="16" text-anchor="middle">corrections, then a fresh review</text>

  <!-- writer lane -->
  <rect class="box" x="20" y="40" width="170" height="60" rx="10"/>
  <text class="title" x="105" y="66" text-anchor="middle">Source code</text>
  <text class="sub" x="105" y="85" text-anchor="middle">app, screenshots</text>

  <rect class="agent" x="230" y="40" width="170" height="60" rx="10"/>
  <text class="title" x="315" y="66" text-anchor="middle">Writer agent</text>
  <text class="sub" x="315" y="85" text-anchor="middle">fresh context</text>

  <rect class="box" x="440" y="40" width="170" height="60" rx="10"/>
  <text class="title" x="525" y="66" text-anchor="middle">guide.md + images</text>
  <text class="sub" x="525" y="85" text-anchor="middle">MISSING if unproven</text>

  <path class="line" d="M190 70 H228" marker-end="url(#a)"/>
  <path class="line" d="M400 70 H438" marker-end="url(#a)"/>

  <!-- private notes -->
  <rect class="private" x="230" y="125" width="170" height="56" rx="10"/>
  <text class="title" x="315" y="149" text-anchor="middle">facts.md, notes</text>
  <text class="sub" x="315" y="167" text-anchor="middle">writer only</text>
  <path class="line" d="M315 100 V123" marker-end="url(#a)"/>

  <!-- reviewer lane -->
  <rect class="agent" x="440" y="220" width="170" height="60" rx="10"/>
  <text class="title" x="525" y="246" text-anchor="middle">Reviewer agent</text>
  <text class="sub" x="525" y="265" text-anchor="middle">builds its own inventory</text>

  <rect class="box" x="650" y="220" width="170" height="60" rx="10"/>
  <text class="title" x="735" y="246" text-anchor="middle">Review findings</text>
  <text class="sub" x="735" y="265" text-anchor="middle">review.md</text>

  <path class="line" d="M525 100 V218" marker-end="url(#a)"/>
  <text class="label" x="533" y="165">guide + images</text>

  <path class="line" d="M105 100 V250 H438" marker-end="url(#a)"/>
  <text class="label" x="200" y="243">original source</text>

  <path class="line" d="M610 250 H648" marker-end="url(#a)"/>

  <!-- withheld notes -->
  <path class="blocked" d="M400 165 L470 216"/>
  <line class="x" x1="425" y1="177" x2="441" y2="193"/>
  <line class="x" x1="441" y1="177" x2="425" y2="193"/>
  <text class="label-red" x="372" y="212" text-anchor="end">withheld</text>

  <!-- human lane -->
  <path class="line" d="M735 280 V320 H525 V358" marker-end="url(#a)"/>
  <text class="label" x="630" y="313" text-anchor="middle">passes review</text>

  <rect class="human" x="440" y="360" width="170" height="64" rx="10"/>
  <text class="title" x="525" y="386" text-anchor="middle">You approve</text>
  <text class="sub" x="525" y="406" text-anchor="middle">your words, date, hash</text>

  <rect class="box" x="650" y="360" width="170" height="64" rx="10"/>
  <text class="title" x="735" y="386" text-anchor="middle">Word export</text>
  <text class="sub" x="735" y="406" text-anchor="middle">not while MISSING</text>

  <path class="line" d="M610 392 H648" marker-end="url(#a)"/>

  <text class="label" x="20" y="400">Change one line or image:</text>
  <text class="label" x="20" y="418">the hash changes, review again.</text>
</svg>
