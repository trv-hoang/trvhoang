{{/* Title and one-line description at the top of a list page.
     Usage: {{ partial "ui/page-header.html" (dict "title" .Title "lede" .Params.description) }} */}}
<header class="mb-10 sm:mb-12">
  <h1 class="page-title" data-intro>{{ .title }}</h1>
  {{ with .lede }}<p class="page-lede" data-intro style="--i: 1">{{ . }}</p>{{ end }}
  {{ with .meta }}<p class="mt-2 text-sm text-muted-foreground" data-intro style="--i: 2">{{ . }}</p>{{ end }}
</header>
