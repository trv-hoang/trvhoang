<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" class="dark">
<head>
  {{ partial "site/head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
  {{ partial "site/background.html" . }}

  <div class="site-shell">
    {{ partial "site/nav.html" . }}

    <main id="main" class="container-page page grow">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "site/footer.html" . }}
  </div>

  {{ partial "site/scripts.html" . }}
</body>
</html>
